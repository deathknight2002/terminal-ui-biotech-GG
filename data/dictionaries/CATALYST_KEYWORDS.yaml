# Importance scoring calculation
# Base score starts with catalyst weight, then modifiers applied
scoring_rules:
  # Catalyst weight provides base score
  # Then apply these modifiers:
  modifiers:
    portfolio_relevance: 15  # +15 if company in portfolio
    cross_source_count_2plus: 10  # +10 if 2+ sources
    smid_cap: 10  # +10 if SMID cap company
    large_cap_discount: -15  # -15 if large cap (unless megadeal)

  # Map final score to importance bands
  importance_bands:
    critical: 85  # 85-100
    high: 70      # 70-84
    medium: 40    # 40-69
    low: 0        # 0-39

# SMID vs Large Cap classification
market_cap_buckets:
  smid:
    max_market_cap_usd: 10_000_000_000  # $10B
    boost: 10
  large:
    min_market_cap_usd: 10_000_000_000
    discount: -15
  mega:
    min_market_cap_usd: 100_000_000_000  # $100B
    discount: -20
