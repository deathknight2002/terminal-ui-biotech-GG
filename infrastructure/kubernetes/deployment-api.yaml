---
# Deployment for FastAPI backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biotech-terminal-api
  namespace: biotech-terminal
  labels:
    app: biotech-terminal
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: biotech-terminal
      component: api
  template:
    metadata:
      labels:
        app: biotech-terminal
        component: api
    spec:
      containers:
      - name: api
        image: biotech-terminal/api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: biotech-terminal-secrets
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: biotech-terminal-secrets
              key: DATABASE_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: biotech-terminal-secrets
              key: JWT_SECRET
        envFrom:
        - configMapRef:
            name: biotech-terminal-config
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ml-models-pvc
---
# Service for FastAPI backend
apiVersion: v1
kind: Service
metadata:
  name: biotech-terminal-api
  namespace: biotech-terminal
  labels:
    app: biotech-terminal
    component: api
spec:
  type: ClusterIP
  selector:
    app: biotech-terminal
    component: api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
---
# HorizontalPodAutoscaler for API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: biotech-terminal-api-hpa
  namespace: biotech-terminal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: biotech-terminal-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
