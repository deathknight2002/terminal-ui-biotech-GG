[tool.poetry]
name = "biotech-terminal"
version = "1.0.0"
description = "Open-source biotech terminal platform with financial modeling and pharmaceutical intelligence"
authors = ["Biotech Terminal Team <team@bioterminal.dev>"]
license = "MIT"
readme = "README.md"
packages = [
    {include = "bt_platform"},
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
pydantic = "^2.4.2"
sqlalchemy = "^2.0.23"
psycopg2-binary = "^2.9.9"
redis = "^5.0.1"
python-multipart = "^0.0.18"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
aiofiles = "^23.2.1"
websockets = ">=13.0"
plotly = "^5.17.0"
duckdb = "^1.1.2"
polars = "^1.9.0"
requests = "^2.32.4"
yfinance = "^0.2.22"
pyarrow = "^18.0.0"
pydantic-settings = "^2.11.0"
python-dotenv = "^1.1.1"
textual = "^0.47.0"
rich = "^13.7.0"
# Scraping dependencies
httpx = {extras = ["http2", "brotli"], version = "^0.25.2"}
selectolax = "^0.3.17"
lxml = "^5.0.0"
pyyaml = "^6.0.1"
playwright = "^1.40.0"
feedparser = "^6.0.10"
python-dateutil = "^2.8.2"
orjson = "^3.9.10"
simhash = "^2.1.2"
datasketch = "^1.6.4"
beautifulsoup4 = "^4.12.2"
summa = "^1.2.0"
scikit-learn = "^1.3.2"
# Scheduling dependencies
apscheduler = "^3.10.4"
# ML dependencies for sentiment and backtesting
joblib = "^1.3.2"
pandas = "^2.0.0"
numpy = "^1.24.0"
scipy = "^1.11.0"
# Dagster and ML dependencies (temporarily disabled due to Python 3.12 compatibility)
# dagster = "^1.8.0"
# dagster-webserver = "^1.8.0"
# dagster-postgres = "^0.24.0"
# dagster-aws = "^0.24.0"
# ML modeling dependencies
xgboost = "^2.0.0"
lightgbm = "^4.0.0"
shap = "^0.45.0"
great-expectations = "^1.2.0"
alembic = "^1.13.0"
mlflow = "^2.16.0"
boto3 = "^1.35.0"
# Observability dependencies
sentry-sdk = {extras = ["fastapi"], version = "^2.0.0"}
prometheus-client = "^0.20.0"
python-json-logger = "^2.0.7"
dash = "^3.2.0"

[tool.poetry.group.transformers]
optional = true

[tool.poetry.group.transformers.dependencies]
transformers = "^4.30.0"
torch = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^24.3.0"
ruff = "^0.14.0"
mypy = "^1.7.1"
pre-commit = "^3.5.0"
flake8 = "^7.0.0"
isort = "^5.13.2"
bandit = "^1.7.8"

[tool.poetry.group.test.dependencies]
pytest-mock = "^3.12.0"
respx = "^0.20.2"
pytest-vcr = "^1.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | node_modules
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/node_modules/*"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["bt_platform"]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
