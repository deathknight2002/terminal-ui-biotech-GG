name: Evidence Graph — smoke + policy

on:
  pull_request:
    paths:
      - 'docs/evidence-graph/**'
      - 'terminal/src/pages/EvidenceGraph*'
      - 'terminal/src/components/EvidenceGraph*'
      - 'backend/**'
      - 'standalone_evidence_api.py'
      - 'test_evidence_graph.sh'
      - 'bt_platform/core/endpoints/evidence_graph.py'
      - 'bt_platform/core/evidence_graph/**'
  push:
    branches: [ main ]
    paths:
      - 'docs/evidence-graph/**'
      - 'terminal/src/pages/EvidenceGraph*'
      - 'terminal/src/components/EvidenceGraph*'
      - 'backend/**'
      - 'standalone_evidence_api.py'
      - 'test_evidence_graph.sh'
      - 'bt_platform/core/endpoints/evidence_graph.py'
      - 'bt_platform/core/evidence_graph/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          # Fallbacks in case requirements file names differ in your repo
          pip install fastapi uvicorn[standard] pydantic python-dotenv

      - name: Start API
        run: |
          set -e
          # Prefer your project entrypoint; fallback to uvicorn if needed.
          if [ -f standalone_evidence_api.py ]; then
            (python3 standalone_evidence_api.py & echo $! > api.pid)
          elif [ -f backend/main.py ]; then
            (uvicorn backend.main:app --host 127.0.0.1 --port 8000 & echo $! > api.pid)
          else
            echo "No API entrypoint found"; exit 1
          fi
          # Basic wait for port 8000
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/health && break || sleep 1
          done

      - name: Run smoke test
        env:
          VITE_PYTHON_API_URL: http://127.0.0.1:8000
        run: bash test_evidence_graph.sh

      - name: Stop API
        if: always()
        run: |
          kill $(cat api.pid) 2>/dev/null || true
          rm -f api.pid
